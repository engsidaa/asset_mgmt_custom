[project]
name = "asset_mgmt_custom"
authors = [{ name = "Custom" }]
description = "Custom extensions for ERPNext Asset & Maintenance modules"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["frappe", "erpnext"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "asset_mgmt_custom"
